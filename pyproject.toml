[project]
name = "drlibre"
version = "0.1.0"
description = "Hospital appointment scheduling, hexagonal Django back end."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6,<5.7",
    "django>=6.1,<6.2",
    "django-ninja>=1.8,<1.9",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "pre-commit>=4.7.0",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-django>=4.14.0",
    "python-doctor>=2026.5.11",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "DJ", "N", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyrefly]
project-includes = ["src", "config", "tests", "scripts", "manage.py"]
search-path = ["src", "."]
python-version = "3.13"

[tool.importlinter]
root_packages = ["drlibre"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: needs the compose PostgreSQL, Redis or Mailpit services"]
addopts = "--strict-markers"

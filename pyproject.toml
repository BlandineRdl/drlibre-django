[project]
name = "drlibre"
version = "0.1.0"
description = "Hospital appointment scheduling, hexagonal Django back end."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "celery[redis]>=5.6,<5.7",
    "django>=6.1,<6.2",
    "django-ninja>=1.8,<1.9",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.3",
    "redis>=8.1,<9",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "django-upgrade>=1.33.0",
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "locust>=2.47.0",
    "pre-commit>=4.7.0",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10,<0.11",
    "python-doctor>=2026.5.11",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "DJ", "N", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"**/migrations/*" = ["RUF012", "E501"]

[tool.pyrefly]
project-includes = ["src", "config", "tests", "scripts", "manage.py"]
search-path = ["src", "."]
python-version = "3.13"

[tool.importlinter]
root_packages = ["drlibre"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and shared kernel stay pure Python"
type = "forbidden"
source_modules = ["drlibre.*.domain", "drlibre.shared_kernel"]
forbidden_modules = [
    "django",
    "ninja",
    "celery",
    "drlibre.*.application",
    "drlibre.*.infrastructure",
    "drlibre.interfaces",
    "drlibre.bootstrap",
    "drlibre.persistence",
]

[[tool.importlinter.contracts]]
name = "Application depends on ports, not frameworks or adapters"
type = "forbidden"
source_modules = ["drlibre.*.application"]
forbidden_modules = [
    "django",
    "ninja",
    "celery",
    "drlibre.*.infrastructure",
    "drlibre.interfaces",
    "drlibre.bootstrap",
    "drlibre.persistence",
]

[[tool.importlinter.contracts]]
name = "Interfaces reach use cases only through bootstrap"
type = "forbidden"
source_modules = ["drlibre.interfaces"]
forbidden_modules = [
    "drlibre.*.infrastructure",
    "drlibre.*.domain",
    "drlibre.*.application.use_cases",
    "drlibre.persistence",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Persistence imports no context"
type = "forbidden"
source_modules = ["drlibre.persistence"]
forbidden_modules = [
    "drlibre.audit",
    "drlibre.booking",
    "drlibre.health",
    "drlibre.identity",
    "drlibre.interop",
    "drlibre.notifications",
    "drlibre.organisation",
    "drlibre.reporting",
    "drlibre.scheduling",
    "drlibre.search",
    "drlibre.interfaces",
    "drlibre.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Each context layers infrastructure over application over domain"
type = "layers"
containers = ["drlibre.audit", "drlibre.booking", "drlibre.health", "drlibre.identity", "drlibre.interop", "drlibre.notifications", "drlibre.organisation", "drlibre.reporting", "drlibre.scheduling", "drlibre.search"]
layers = ["infrastructure", "application", "(domain)"]

[[tool.importlinter.contracts]]
name = "Identity's core never imports notifications or organisation"
type = "forbidden"
source_modules = ["drlibre.identity.domain", "drlibre.identity.application"]
forbidden_modules = ["drlibre.booking", "drlibre.notifications", "drlibre.organisation"]

[[tool.importlinter.contracts]]
name = "Organisation's core reaches identity and scheduling only through its own ports"
type = "forbidden"
source_modules = ["drlibre.organisation.domain", "drlibre.organisation.application"]
forbidden_modules = ["drlibre.booking", "drlibre.identity", "drlibre.scheduling"]

[[tool.importlinter.contracts]]
name = "Scheduling's core reaches identity and organisation only through its own ports"
type = "forbidden"
source_modules = ["drlibre.scheduling.domain", "drlibre.scheduling.application"]
forbidden_modules = ["drlibre.booking", "drlibre.identity", "drlibre.organisation"]

[[tool.importlinter.contracts]]
name = "Booking's core reaches identity, notifications, organisation and scheduling only through its own ports"
type = "forbidden"
source_modules = ["drlibre.booking.domain", "drlibre.booking.application"]
forbidden_modules = [
    "drlibre.identity",
    "drlibre.notifications",
    "drlibre.organisation",
    "drlibre.scheduling",
]

[[tool.importlinter.contracts]]
name = "Search's core imports no other context"
type = "forbidden"
source_modules = ["drlibre.search.domain", "drlibre.search.application"]
forbidden_modules = [
    "drlibre.audit",
    "drlibre.booking",
    "drlibre.health",
    "drlibre.identity",
    "drlibre.notifications",
    "drlibre.organisation",
    "drlibre.scheduling",
]

[[tool.importlinter.contracts]]
name = "Reporting's core imports no other context"
type = "forbidden"
source_modules = ["drlibre.reporting.domain", "drlibre.reporting.application"]
forbidden_modules = [
    "drlibre.audit",
    "drlibre.booking",
    "drlibre.health",
    "drlibre.identity",
    "drlibre.notifications",
    "drlibre.organisation",
    "drlibre.scheduling",
    "drlibre.search",
]

[[tool.importlinter.contracts]]
name = "Interop's core imports no other context"
type = "forbidden"
source_modules = ["drlibre.interop.domain", "drlibre.interop.application"]
forbidden_modules = [
    "drlibre.audit",
    "drlibre.booking",
    "drlibre.health",
    "drlibre.identity",
    "drlibre.notifications",
    "drlibre.organisation",
    "drlibre.reporting",
    "drlibre.scheduling",
    "drlibre.search",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: needs the compose PostgreSQL, Redis or Mailpit services",
    "e2e: Playwright journey against the compose web service; run with -m e2e",
]
addopts = "--strict-markers -m 'not e2e'"

[tool.python-doctor]
profile = "web"
# Pyrefly is configured above but not detected by Python Doctor.
suppress = ["structure/no-type-checker"]

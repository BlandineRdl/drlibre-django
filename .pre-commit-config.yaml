# Local hooks run the uv-locked tool versions, so the gate matches `uv run`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: python-doctor
        name: python-doctor
        entry: uv run python-doctor . --min-score 90 --no-cache --score
        language: system
        types: [python]
        pass_filenames: false

# Local hooks run the uv-locked tool versions, so the gate matches `uv run`.
repos:
  - repo: local
    hooks:
      - id: django-upgrade
        name: django-upgrade
        entry: uv run django-upgrade
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: python-doctor
        name: python-doctor
        entry: uv run python-doctor . --min-score 90 --no-cache --score
        language: system
        types: [python]
        pass_filenames: false
      - id: django-deploy-check
        name: django check --deploy
        entry: env HTTPS_ONLY=true uv run python manage.py check --deploy --fail-level WARNING
        language: system
        types: [python]
        pass_filenames: false
      - id: django-missing-migrations
        name: django makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        types: [python]
        pass_filenames: false

<form method="post" action="{{ page.action }}" novalidate>
  {% csrf_token %}
  {% for hidden in hidden_fields %}<input type="hidden" name="{{ hidden.0 }}" value="{{ hidden.1 }}">{% endfor %}
  {{ page.form }}
  <div class="actions">
    <button type="submit"{% if page.submit_class %} class="{{ page.submit_class }}"{% endif %}>{{ page.submit_label }}</button>
    {% if page.cancel_url %}<a href="{{ page.cancel_url }}">{{ page.cancel_label }}</a>{% endif %}
  </div>
</form>

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: drlibre-app:${APP_IMAGE_TAG:-dev}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    ALLOWED_HOSTS: '["localhost","127.0.0.1","web"]'
    # Load runs raise it without editing .env (scripts/load-run.sh).
    NETWORK_HOURLY_LIMIT: ${NETWORK_HOURLY_LIMIT:-20}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ["/app/docker/entrypoint.sh"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *app
    command: ["celery", "-A", "config", "--quiet", "worker", "--loglevel", "INFO"]

  beat:
    <<: *app
    command: ["celery", "-A", "config", "--quiet", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      # Reverse DNS on each SMTP client stalls every send by seconds on localhost.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
